[project]
name = "docket-mcp"
version = "0.1.0"
description = "MCP server for Regulations.gov: search federal dockets and fetch rulemaking documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
docket-mcp = "docket_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docket_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
